# Vercel 本番デプロイ（GitHub App を使わない CI ルート）
#
# 経緯: Vercel の公式 GitHub App 連携がアカウント制約でブロックされ、main への
# push で自動デプロイができなくなった。そこで GitHub App に依存せず、
# 「GitHub Actions（正常）＋ Vercel CLI（正常）＋ デプロイ用トークン」で
# 本番反映を自動化する。main への push か、手動実行（workflow_dispatch）で走る。
#
# 必要な GitHub Secrets（Settings → Secrets and variables → Actions）:
#   - VERCEL_TOKEN       : vercel.com/account/tokens で発行したトークン
#   - VERCEL_ORG_ID      : .vercel/project.json の "orgId"
#   - VERCEL_PROJECT_ID  : .vercel/project.json の "projectId"
#
# ビルド時の環境変数（VITE_SUPABASE_URL 等）は Vercel プロジェクト側に設定済みの
# ものを `vercel pull` が取得するため、ここに重複定義は不要。
name: Deploy to Vercel (Production)

on:
  push:
    branches: [main]
    # 文書だけの変更では出し直さない（Vercel の無料プランは 1 日 100 回まで・2026-11-15 に使い切った）
    paths-ignore:
      - 'company/**'
      - 'docs/**'
      - '**/*.md'
      - 'marketing-out/**'
  workflow_dispatch: {}

# 同時に複数デプロイが走らないよう直列化（新しい push が来たら古い実行は中断）
concurrency:
  group: vercel-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings & env (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # VITE_ で始まる変数はビルドでアプリに書き込む値。Vercel で Secret にすると `vercel pull` が取り出せず
      # "[SENSITIVE]" という文字が入り、アプリが起動できない（2026-10-24 に本番が真っ暗になった原因）。
      # 2026-11-23: リポジトリの .env.production（秘密でない値だけ）に同じ名前があれば、その値でビルドする
      # （11/22 に VITE_FOUNDING_OFFER_END が Secret で作られ、それから本番に出せなくなっていた）。無いものだけ名前を出して止める。
      - name: Check VITE_ variables are not Secret
        run: |
          bad=""
          for name in $(grep -oE '^VITE_[A-Z0-9_]+="?\[SENSITIVE\]' .vercel/.env.production.local | cut -d= -f1 || true); do
            committed=$(grep -E "^${name}=" .env.production | head -1 | cut -d= -f2- || true)
            if [ -n "$committed" ]; then
              sed -i "s|^${name}=.*|${name}=\"${committed}\"|" .vercel/.env.production.local
              echo "::warning::${name} は Vercel で Secret になっています。.env.production の値でビルドします（Vercel で Type を Config にして作り直すと、この注意は消えます）"
            else
              bad="$bad $name"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::Vercel で Secret になっている VITE_ の変数があります。Type を Config にして作り直してください:$bad"
            exit 1
          fi

      - name: Build (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
