<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!--
    interactive-widget=resizes-content: iOS Safari の仮想キーボードが
    開いた時、layout viewport をキーボード上の領域に縮める。これがないと
    BottomNav が押し上げられて入力欄に重なる。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Orime" />
  <meta name="description" content="読むほど、自分だけの相談相手が育つ。読んだ本のメモを根拠に、困ったときに答えが返ってくる読書アプリ" />
  <!-- 🔗 SNS シェア時のリッチプレビュー（Open Graph / Twitter Card）。
       LINE / X / Slack 等で URL を貼ったときにブランドカードが出る＝口コミ流入の質が上がる。 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Orime" />
  <meta property="og:title" content="Orime｜読むほど、自分だけの相談相手が育つ読書アプリ" />
  <meta property="og:description" content="読みながら残したメモをもとに、困ったときの相談に答えるアプリ。答えには、根拠にした本とメモが付きます。" />
  <meta property="og:url" content="https://orime.vercel.app/" />
  <meta property="og:image" content="https://orime.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Orime｜読むほど、自分だけの相談相手が育つ読書アプリ" />
  <meta name="twitter:description" content="読みながら残したメモをもとに、困ったときの相談に答えるアプリ。答えには、根拠にした本とメモが付きます。" />
  <meta name="twitter:image" content="https://orime.vercel.app/og-image.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <!-- フォントは OS 標準（-apple-system / Hiragino Sans・Mincho 等）に全面移行済み。
       かつて読み込んでいた Google Fonts の Noto Serif JP(和文・数MB級) + Inter は
       レンダーブロッキングで初回表示を大きく遅らせていたため撤去。
       LP / 法務ページの serif 見出しは landing.css/legal.css の OS mincho フォール
       バック(Yu Mincho / Hiragino Mincho ProN)で同等の見た目を保つ（ダウンロード 0）。 -->
  <title>Orime｜読むほど、自分だけの相談相手が育つ読書アプリ</title>
  <!--
    Global styles, design tokens, and animation keyframes live in
    src/index.css (loaded by main.jsx). This block intentionally minimal.
  -->
  <style>
    /* Pre-Vite paint: avoid white flash before the bundled CSS arrives. */
    body { margin: 0; background: #f5f0e8; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!--
    Service Worker registration is handled in src/lib/swUpdate.js so the
    React side can show a toast when a new version is detected. Don't
    register from here.
  -->

</body>
</html>
