<!DOCTYPE html>
<!-- data-dark-ready: 暗い画面のトークンを最初の描画から効かせる（JS を待つと、暗い設定の端末で一瞬明るくなる・2026-11-20）。main.jsx も同じ印を付ける。 -->
<html lang="ja" data-dark-ready>
<head>
  <meta charset="UTF-8" />
  <!--
    interactive-widget=resizes-content: iOS Safari の仮想キーボードが
    開いた時、layout viewport をキーボード上の領域に縮める。これがないと
    BottomNav が押し上げられて入力欄に重なる。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="orime" />
  <meta name="description" content="読んだ本と会話できる読書メモアプリ。気になった一行をメモしておくと、迷ったときに AI が、あなたのメモをもとに、その本の考え方で答えます。時間を決めて読むタイマーや、読書の記録もあります。ブクログや Kindle の記録を取り込めて、無料プランで始められます。" />
  <!-- 🔗 SNS シェア時のリッチプレビュー（Open Graph / Twitter Card）。
       LINE / X / Slack 等で URL を貼ったときにブランドカードが出る＝口コミ流入の質が上がる。 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="orime" />
  <meta property="og:title" content="orime｜読んだ本が、相談相手になる読書メモアプリ" />
  <meta property="og:description" content="気になった一行をメモしておくと、迷ったときに AI があなたのメモをもとに、その本の考え方で答えてくれる読書メモアプリです。" />
  <meta property="og:url" content="https://orime.vercel.app/" />
  <meta property="og:image" content="https://orime.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ja_JP" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="orime｜読んだ本が、相談相手になる読書メモアプリ" />
  <meta name="twitter:description" content="気になった一行をメモしておくと、迷ったときに AI があなたのメモをもとに、その本の考え方で答えてくれる読書メモアプリです。" />
  <meta name="twitter:image" content="https://orime.vercel.app/og-image.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <!-- フォントは OS 標準（-apple-system / Hiragino Sans・Mincho 等）に全面移行済み。
       かつて読み込んでいた Google Fonts の Noto Serif JP(和文・数MB級) + Inter は
       レンダーブロッキングで初回表示を大きく遅らせていたため撤去。
       LP / 法務ページの serif 見出しは landing.css/legal.css の OS mincho フォール
       バック(Yu Mincho / Hiragino Mincho ProN)で同等の見た目を保つ（ダウンロード 0）。 -->
  <!-- 題・説明は LP（src/pages/Landing.jsx の TITLE / DESCRIPTION / OG_DESCRIPTION）と同じ言葉にそろえる（2026-10-05） -->
  <title>orime｜読んだ本が、相談相手になる読書メモアプリ</title>
  <!--
    Global styles, design tokens, and animation keyframes live in
    src/index.css (loaded by main.jsx). This block intentionally minimal.
  -->
  <style>
    /* Pre-Vite paint: avoid white flash before the bundled CSS arrives. */
    /* html にも同じ地を塗る＝iPhone のアプリで画面の端（状態バーの下・ホームバーの横・引っ張ったときの外側）も同じ色に（2026-11-24）。 */
    html, body { background: #f5f0e8; }
    body { margin: 0; }
    /* 暗い設定の端末は、読み込みの前から暗い地（tokens.css の暗い --bg と同じ値・2026-11-23）。 */
    @media (prefers-color-scheme: dark) { html, body { background: #1b1a18; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!--
    Service Worker registration is handled in src/lib/swUpdate.js so the
    React side can show a toast when a new version is detected. Don't
    register from here.
  -->

</body>
</html>
