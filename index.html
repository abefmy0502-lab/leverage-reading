<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8A7040" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="読書ログ" />
  <meta name="description" content="読書を投資に変える、ROIを最大化する読書管理アプリ" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <title>レバレッジ読書ログ</title>
  <style>
    /* ===== Global mobile-safe baseline ===== */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-x: hidden;
    }
    body {
      margin: 0;
      font-family: 'Noto Serif JP', Georgia, serif;
      background: #f5f0e8;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      max-width: 100vw;
      box-sizing: border-box;
      /* Honour iOS notch/home indicator for the entire app surface */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    img, video, iframe { max-width: 100%; }

    /* iOS Safari zooms inputs whose font-size is < 16px on focus. */
    input, textarea, select { font-size: 16px; }

    /* Visual feedback on press — iOS has no :hover, so :active matters. */
    button, [role="button"], a, summary {
      transition: transform .1s ease, opacity .1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active, [role="button"]:active, a:active, summary:active {
      transform: scale(0.97);
      opacity: 0.85;
    }
    button:disabled:active { transform: none; opacity: 0.6; }

    /* Momentum scrolling for any horizontal-scroll containers */
    .h-scroll, [data-h-scroll] {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
