<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <!--
    interactive-widget=resizes-content: iOS Safari の仮想キーボードが
    開いた時、layout viewport をキーボード上の領域に縮める。これがないと
    BottomNav が押し上げられて入力欄に重なる。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#8A7040" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Orime" />
  <meta name="description" content="読みっぱなしを、やめる。気づきを後から呼び戻し、行動に変える読書アプリ" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <!-- LP の serif 見出し / sans 本文用フォント。CSP は fonts.googleapis.com /
       fonts.gstatic.com を既に許可済み。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Orime｜読書を、行動に変える読書メモ</title>
  <!--
    Global styles, design tokens, and animation keyframes live in
    src/index.css (loaded by main.jsx). This block intentionally minimal.
  -->
  <style>
    /* Pre-Vite paint: avoid white flash before the bundled CSS arrives. */
    body { margin: 0; background: #f5f0e8; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!--
    Service Worker registration is handled in src/lib/swUpdate.js so the
    React side can show a toast when a new version is detected. Don't
    register from here.
  -->

</body>
</html>
